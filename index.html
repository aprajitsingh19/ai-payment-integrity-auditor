const P=Object.keys(bv).sort(),fl=P.map(p=>bv[p].filter(r=>r.score>=S.cut).length),fm=Math.max(...fl,1),rm=Math.max(...P.map(p=>pr[p]))*1.1,pts=P.map((p,i)=>`${63+i*60},${240-pr[p]/rm*220}`);
const pv=`<svg viewBox="0 0 520 270" role="img" aria-label="Flagged claims and billing level by hospital">${grid(240,520,fm)}${P.map((p,i)=>`<rect x="${44+i*60}" y="${240-fl[i]/fm*220}" width="38" height="${fl[i]/fm*220}" fill="var(--red)"/><text x="${63+i*60}" y="256" text-anchor="middle" class="ax">${p.slice(-1)}</text>`).join("")}<polyline points="${pts.join(" ")}" fill="none" stroke="var(--blu)" stroke-width="2"/>${pts.map(q=>`<circle cx="${q.split(",")[0]}" cy="${q.split(",")[1]}" r="3.5" fill="var(--blu)"/>`).join("")}</svg>`;
$("v1").innerHTML=`<div class="g4"><div class="card w"><h2>Anomaly detection</h2><div class="big g">${Math.round(c/A.length*100)}%</div><div class="sm">of planted problems caught (${c} of ${A.length})</div><p class="sm">${F.length-c} false alarms. Hit rate <b class="g">${Math.round(prec*100)}%</b> vs <b>${Math.round(base*100)}%</b> with random review.</p></div>
<div class="card w"><h2>Upcoding alerts</h2><div class="big r">${up.length}</div><div class="sm">flagged claims billed at 1.5x peer median or more</div><p class="sm">Excess over peers: <b>${inr(upx)}</b></p></div>
<div class="card w"><h2>Claims audit workflow</h2>${pb("Escalate",pl["Escalate"]||0,F.length)}${pb("Request documents",pl["Request documents"]||0,F.length)}${pb("Approve (below risk bar)",pl["Approve"]||0,F.length)}</div>
<div class="card w"><h2>Provider profiling</h2><div class="row"><div>${dn(F.length?bad/F.length:0,"var(--red)","from Hospitals E and H")}</div><div>${dn(c/A.length,"var(--grn)","catch rate")}</div></div></div></div>
<div class="kp"><div><b>${F.length} of ${N.toLocaleString()}</b><span>claims flagged for human review</span></div><div><b>${inr(sus)}</b><span>suspicious amount (excess over peer median, plus duplicates)</span></div><div><b class="g">${inr(rec)}</b><span>potential recovery at ${S.rec}%</span></div><div><b>${inr(rec-cost)}</b><span>net value after ${inr(cost)} review cost</span></div><div><b>${Math.round(hs).toLocaleString()} hrs</b><span>investigator time saved vs random sampling to find the same problems</span></div></div>
<div class="two"><div class="card w"><h2>Claims by risk score</h2>${hist}<p class="sm">Red: planted problems. Grey: normal claims. Faded bars fall below your review threshold.</p></div><div class="card w"><h2>Provider profiling</h2>${pv}<p class="sm">Red bars: flagged claims per hospital (A to H). Blue line: average bill relative to peers; Hospitals E and H are built to bill high.</p></div></div>
<div class="two"><div class="card"><h2>Planted problems caught, by type</h2>${bars(types)}</div><div class="card"><h2>Recommended next AI use cases</h2><ul><li><b>Claim summarisation</b> for investigators: high feasibility, data already available.</li><li><b>Document extraction</b> from itemised bills: speeds the "request documents" step.</li><li><b>Provider pattern monitoring</b>: repeat behaviour a single claim cannot show.</li></ul><p class="note">The AI explains and investigates. People decide.</p></div></div>`}
function list(){const F=R.filter(r=>r.score>=S.cut).sort((a,b)=>b.score-a.score),T=F.slice(0,80);
$("lcount").textContent=`${F.length} flagged at threshold ${S.cut}. Showing the top ${T.length} by risk score.`;
$("lst").innerHTML="<tr><th>Claim</th><th>Hospital</th><th>Procedure</th><th>Billed</th><th>Risk</th></tr>"+T.map(r=>`<tr class="c ${sel&&sel.id===r.id?"sel":""}" data-id="${r.id}"><td>${r.id}</td><td>${r.prov.slice(-1)}</td><td>${r.proc}</td><td>${inr(r.bill)}</td><td><span class="bd ${lvl(r)[0]}">${r.score}</span></td></tr>`).join("");
document.querySelectorAll("tr.c").forEach(t=>t.onclick=()=>{sel=R.find(r=>r.id===t.dataset.id);list();detail()})}
function detail(){const r=sel;$("det").innerHTML=`<h2>${r.id}: ${r.proc} at ${r.prov}</h2><dl class="dl"><dt>Risk</dt><dd><span class="bd ${lvl(r)[0]}">${lvl(r)[1]}</span> ${r.score} points</dd><dt>Billed</dt><dd>${inr(r.bill)} (peer median ${inr(pm[r.proc])})</dd><dt>Diagnosis</dt><dd>${r.dx}</dd><dt>Stay</dt><dd>${r.los} days</dd><dt>Patient</dt><dd>${r.age} years, ${r.prior} prior claims</dd></dl><p><b>Why it was flagged</b></p><ul>${r.why.map(w=>`<li>${w}</li>`).join("")}</ul><button class="pri" id="go">Run Investigator Agent</button><div id="ag"></div>`;$("go").onclick=()=>investigate(r)}
const tools=r=>{const f={
peer_benchmark:i=>{const c=R.find(x=>x.id===i.claim_id),p=R.filter(x=>x.proc===c.proc).map(x=>x.bill);return{procedure:c.proc,billed:c.bill,peer_median:pm[c.proc],peer_p25:qt(p,.25),peer_p75:qt(p,.75),ratio_to_median:+c.ratio.toFixed(2),percentile:Math.round(p.filter(x=>x<c.bill).length/p.length*100),excess_over_median:Math.round(Math.max(0,c.bill-pm[c.proc]))}},
duplicate_search:i=>{const c=R.find(x=>x.id===i.claim_id);return{matches:R.filter(x=>x.id!==c.id&&x.pid===c.pid&&x.proc===c.proc&&x.prov===c.prov&&Math.abs(new Date(x.date)-new Date(c.date))/864e5<=14).map(x=>({claim_id:x.id,date:x.date,billed:x.bill}))}},
provider_history:i=>{const p=bv[i.provider];if(!p)return{error:"unknown provider"};const rk=Object.keys(pr).sort((a,b)=>pr[b]-pr[a]);return{provider:i.provider,claims:p.length,avg_ratio_to_peer_median:+pr[i.provider].toFixed(2),high_risk_claims:p.filter(x=>x.score>=50).length,share_flagged:+(p.filter(x=>x.score>=25).length/p.length).toFixed(3),rank_by_billing:rk.indexOf(i.provider)+1,of:rk.length}},
clinical_consistency:i=>{const c=R.find(x=>x.id===i.claim_id),e=EXP[c.proc];return{diagnosis:c.dx,expected_diagnosis:e[0],diagnosis_matches:c.dx===e[0],los_days:c.los,expected_los:e[1]+"-"+e[2],los_normal:c.los>=e[1]-1&&c.los<=e[2]+2}}};
const cp={claim_id:{type:"string"}},d={peer_benchmark:["Compare the claim's billed amount with peers for the same procedure",cp],duplicate_search:["Find similar claims for the same patient, procedure and hospital within 14 days",cp],provider_history:["Billing pattern and flag history of a hospital",{provider:{type:"string"}}],clinical_consistency:["Check diagnosis fit and length of stay for the claim",cp]};
return Object.keys(f).map(n=>({name:n,description:d[n][0],inputSchema:{type:"object",properties:d[n][1],required:Object.keys(d[n][1])},execute:async i=>{const o=f[n](i);tr.push([n,i,o]);draw();return o}}))};
let tr=[];const draw=()=>{const a=$("ag");if(a)a.querySelector(".trc").innerHTML=tr.map(t=>`<div class="tr"><b>${t[0]}</b> ${esc(JSON.stringify(t[1]))}<br>${esc(JSON.stringify(t[2]))}</div>`).join("")||'<p class="note">Agent is planning its checks...</p>'};
async function investigate(r){tr=[];$("ag").innerHTML=`<h2 style="margin-top:16px">Agent working</h2><div class="trc"></div><div id="cs"></div>`;draw();$("go").disabled=true;let res=null,mode="ai";const T=tools(r);
try{const s=await claude.use("sample");if(!s)throw 0;
const t=await s(`You are a payment-integrity investigator agent at a health insurer. Investigate claim ${r.id} from ${r.prov} (procedure ${r.proc}). Rule engine flags: ${r.why.join("; ")}. Use the tools to gather evidence (always peer_benchmark and clinical_consistency; use duplicate_search and provider_history when relevant). Never invent numbers; use only tool results. Company policy: duplicates and diagnosis mismatches must be escalated. Amounts are in Indian rupees. When done, reply with ONLY a JSON object: {"recommendation":"Approve"|"Request documents"|"Escalate","confidence":"Low"|"Medium"|"High","summary":"3-4 sentence plain-English investigator note","evidence":["..."],"next_steps":["..."]}`,{tools:T,cache:false});
res=JSON.parse(t.text.match(/\{[\s\S]*\}/)[0])}catch(e){mode="rules";tr=[];for(const x of T){await x.execute(x.name==="provider_history"?{provider:r.prov}:{claim_id:r.id})}
const pb=tr[0][2];res={recommendation:policy(r),confidence:r.score>=70?"High":"Medium",summary:`Rule-based case file (AI agent unavailable). ${r.why.join(". ")}. The bill is ${pb.ratio_to_median}x the peer median, about ${inr(pb.excess_over_median)} above it.`,evidence:r.why,next_steps:["Review the itemised bill and coding","Confirm with the provider if needed"]}}
const pol=policy(r),ok=String(res.recommendation).toLowerCase().startsWith(pol.toLowerCase().slice(0,5));
$("cs").innerHTML=`<h2 style="margin-top:14px">Case file</h2><p><b>Recommendation: ${esc(res.recommendation)}</b> (confidence ${esc(res.confidence)}) ${mode==="ai"?"":'<span class="note">rule-based fallback</span>'}</p><p>${esc(res.summary)}</p><b>Evidence</b><ul>${(res.evidence||[]).map(e=>`<li>${esc(e)}</li>`).join("")}</ul><b>Next steps</b><ul>${(res.next_steps||[]).map(e=>`<li>${esc(e)}</li>`).join("")}</ul>${ok?"":`<div class="warn">The agent's recommendation differs from company policy (${pol}). A senior reviewer should check this case.</div>`}<p><b>Your decision</b> <span class="note">(the agent never closes a claim itself)</span></p><button class="sec" data-d="Approved">Approve</button> <button class="sec" data-d="Documents requested">Request documents</button> <button class="sec" data-d="Escalated">Escalate</button><p class="note" id="dc">${DEC[r.id]?"Decision recorded: "+DEC[r.id]:""}</p>`;
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{DEC[r.id]=b.dataset.d;$("dc").textContent="Decision recorded: "+b.dataset.d+" (this session only)"});$("go").disabled=false}
const tab=n=>{$("v1").hidden=n!==1;$("v2").hidden=n!==2;$("t1").className=n===1?"nv on":"nv";$("t2").className=n===2?"nv on":"nv"};$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);
["cut","mins","rate","rec"].forEach(k=>$(k).oninput=e=>{S[k]=+e.target.value;$("cutl").textContent=S.cut;dash();list()});
dash();list();
</script></body></html>
